<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag tối ưu cho iOS, chống zoom tự động -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Random password mkdi01</title>
    <style>
        /* CSS Thuần - Không phụ thuộc vào mạng hay thư viện ngoài */
        :root {
            --primary: #2C3E50;
            --danger: #E74C3C;
            --danger-hover: #c0392b;
            --success: #27AE60;
            --gray-bg: #f3f4f6;
            --white: #ffffff;
            --border: #cbd5e0;
            --focus-ring: rgba(52, 152, 219, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--gray-bg);
            margin: 0;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-top: 4px solid var(--primary);
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary);
            font-size: 22px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #4a5568;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="tel"], input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
            background-color: #fff;
        }

        input[type="tel"]:focus {
            border-color: #3498DB;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        /* Ẩn mũi tên lên xuống của input số */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .input-error {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.2) !important;
        }

        .error-text {
            color: var(--danger);
            font-size: 13px;
            font-style: italic;
            margin-top: 8px;
            margin-bottom: 0;
            display: none;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
            outline: none;
        }

        .btn-primary {
            background-color: var(--danger);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--danger-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background-color: #cbd5e0;
        }

        .result-box {
            background-color: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            position: relative;
        }

        .result-box input {
            background-color: transparent;
            border: none;
            color: var(--success);
            font-weight: bold;
            font-size: 22px;
            padding: 8px;
            box-shadow: none;
        }

        .result-box input:focus {
            box-shadow: none;
        }

        .btn-copy {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            color: #718096;
            padding: 8px;
            flex: none;
            width: auto;
        }

        .btn-copy:hover {
            color: #2d3748;
            background: transparent;
        }

        .hidden {
            display: none !important;
        }

        .toast {
            color: var(--success);
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            margin-bottom: 0;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Random password mkdi01</h1>

        <form id="main-form" onsubmit="event.preventDefault(); onGenerateClick();">
            <div class="form-group">
                <label for="challenge">Mã sinh ra (6 số):</label>
                <input 
                    type="tel" 
                    inputmode="numeric"
                    pattern="[0-9]*"
                    id="challenge" 
                    maxlength="6"
                    placeholder="VD: 123456"
                    autocomplete="off"
                >
                <p id="error-message" class="error-text"></p>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-primary">Tìm Password</button>
                <button type="button" onclick="onClearClick()" class="btn-secondary">Xóa trắng</button>
            </div>
        </form>

        <div class="result-box">
            <label for="result">Mật khẩu Reset:</label>
            <div style="position: relative;">
                <input type="text" id="result" readonly placeholder="---">
                <button type="button" onclick="copyToClipboard()" id="btn-copy" class="btn-copy hidden" title="Copy">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </button>
            </div>
            <p id="copy-toast" class="toast">Đã copy vào clipboard!</p>
        </div>
    </div>

    <script>
        const inputChallenge = document.getElementById('challenge');
        const inputResult = document.getElementById('result');
        const errorMessage = document.getElementById('error-message');
        const btnCopy = document.getElementById('btn-copy');
        const copyToast = document.getElementById('copy-toast');

        // Chỉ cho phép nhập số
        inputChallenge.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
            errorMessage.style.display = 'none';
            inputChallenge.classList.remove('input-error');
        });

        function calculate_tx110_password(challengeCode) {
            const code = challengeCode.trim();

            if (!/^\d{6}$/.test(code)) {
                throw new Error("Mã sinh ra phải bao gồm đúng 6 chữ số!");
            }

            try {
                let step1_val = (parseInt(code, 10) + 632563) % 1000000;
                let step1_str = step1_val.toString().padStart(6, '0');

                let step2_str = step1_str[3] + step1_str[5] + step1_str[4] + step1_str[0] + step1_str[2] + step1_str[1];

                let step3_val = parseInt(step2_str, 10) ^ 367587;
                let final_val = step3_val % 1000000;

                return final_val.toString().padStart(6, '0');
            } catch (e) {
                throw new Error("Lỗi tính toán hệ thống!");
            }
        }

        function onGenerateClick() {
            errorMessage.style.display = 'none';
            inputChallenge.classList.remove('input-error');
            copyToast.style.display = 'none';
            
            const challenge_input = inputChallenge.value;
            
            try {
                const password = calculate_tx110_password(challenge_input);
                inputResult.value = password;
                
                btnCopy.classList.remove('hidden');
                inputChallenge.blur();
                
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                inputChallenge.classList.add('input-error');
                inputResult.value = "";
                btnCopy.classList.add('hidden');
            }
        }

        function onClearClick() {
            inputChallenge.value = "";
            inputResult.value = "";
            
            errorMessage.style.display = 'none';
            inputChallenge.classList.remove('input-error');
            btnCopy.classList.add('hidden');
            copyToast.style.display = 'none';
            
            inputChallenge.focus();
        }

        function copyToClipboard() {
            let textToCopy = inputResult.value;
            if (!textToCopy) return;

            const tempInput = document.createElement("input");
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            
            tempInput.select();
            tempInput.setSelectionRange(0, 99999); 
            
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            copyToast.style.display = 'block';
            setTimeout(() => {
                copyToast.style.display = 'none';
            }, 2000);
        }
    </script>
</body>
</html>
